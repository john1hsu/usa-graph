# Domains the hourly run draws from. Edit freely: add domains, remove ones you
# don't want, or add seed slugs to steer what gets written next. Seeds are
# suggestions, not a queue: skip any that already exist.
# Each domain becomes a SKOS ConceptScheme (us:scheme/<domain>) in the graph.
#
# Goal: an accurate, even-handed, citation-backed picture of the United States
# of America — its land, its Native nations, its history from the colonial era
# to today, how its government and laws work, its people, economy, culture and
# symbols — where every claim traces to a primary, official or scholarly source
# and popular myths are checked against the evidence.

